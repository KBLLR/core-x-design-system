<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Component preview</title>
<!-- Runs one components/<Name>/preview.html on its own: the previews expect the host to
     provide React, tokens.css and the component bundle. Usage: frame.html?c=Button -->
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="../components/bundle.js"></script>
<style>html,body{margin:0;overflow:hidden}</style>
</head>
<body>
<script>
(async () => {
  const name = new URLSearchParams(location.search).get('c') || '';
  if (!/^[A-Za-z0-9]+$/.test(name)) { document.body.textContent = 'Unknown component'; return; }
  let res = null;
  for (let attempt = 0; attempt < 3 && !(res && res.ok); attempt++) {
    if (attempt) await new Promise(r => setTimeout(r, 400 * attempt));
    res = await fetch(`../components/${name}/preview.html`).catch(() => null);
  }
  if (!res || !res.ok) { document.body.textContent = `No preview for ${name}`; return; }
  const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
  doc.querySelectorAll('head style').forEach(s => document.head.appendChild(document.importNode(s, true)));
  const scripts = [...doc.body.querySelectorAll('script')];
  scripts.forEach(s => s.remove());
  document.body.insertAdjacentHTML('afterbegin', doc.body.innerHTML);
  for (const s of scripts) {
    const el = document.createElement('script');
    el.textContent = s.textContent;
    document.body.appendChild(el);
  }
  // The @dsCard size is a hint; report the real content size so the page never clips it.
  const report = () => {
    const d = document.documentElement;
    parent.postMessage({ cxFrame: name, w: d.scrollWidth, h: d.scrollHeight }, location.origin);
  };
  new ResizeObserver(report).observe(document.body);
  report();
})();
</script>
</body>
</html>
