<!-- @dsCard group="Native shell" height=560 width=960 subtitle="Sidebar, toolbar and thread on glass · MACOS theme" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NativeShell</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&family=Inter:wght@200;300;400;500;600;700&display=swap">
<style>
html,body{margin:0;background:var(--bg)}
.stage{position:relative;width:960px;min-height:560px;background:var(--bg);color:var(--fg1);overflow:hidden;box-sizing:border-box;padding:22px 26px}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 99px,#9a9a9a22 99px 100px),repeating-linear-gradient(90deg,transparent 0 99px,#9a9a9a22 99px 100px)}
.stage>*{position:relative}
.lbl{font-family:var(--font-mono);font-size:9px;color:var(--fg2);text-transform:uppercase;letter-spacing:0.1em;margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px;margin-bottom:18px}
.scene{position:relative;background:var(--bg);display:flex;align-items:center;gap:14px;padding:18px;overflow:hidden}
.scene i{position:absolute;display:block}
.scene .b1{left:0;top:0;width:38%;height:100%;background:var(--fg1)}
.scene .b2{left:38%;top:0;width:24%;height:60%;background:var(--accent)}
.scene .b3{left:62%;top:40%;width:18%;height:60%;background:var(--status-green)}
.scene .b4{left:80%;top:0;width:20%;height:100%;background:var(--status-blue)}
.scene>:not(i){position:relative}
.stage{padding:0}
.win{display:grid;grid-template-columns:288px 1fr;height:560px}
.back{position:absolute;inset:0;overflow:hidden}
.back i{position:absolute;display:block}
.back .b1{left:0;top:0;width:170px;height:100%;background:var(--corex-rigging)}
.back .b2{left:170px;top:0;width:118px;height:240px;background:var(--accent)}
.back .b3{right:0;top:0;width:200px;height:120px;background:var(--corex-vega)}
.side{margin:8px;display:flex;flex-direction:column;gap:8px;padding:8px 0}
.side h4{margin:8px 12px 2px;font-family:var(--font-heading);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg2)}
.seg{flex:1;background:none;border:0;color:var(--fg1);font-family:var(--font-heading);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;cursor:pointer}
.seg[aria-pressed=true]{background:var(--bg-elevated)}
.main{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 14px}
.bar b{font-family:var(--font-body);font-size:14px;font-weight:600}
.bar code{font-family:var(--font-mono);font-size:10px;color:var(--fg2)}
.thread{flex:1;display:flex;flex-direction:column;gap:8px;padding:14px;overflow:hidden}
.compose{display:flex;gap:8px;padding:12px;align-items:flex-end}
.compose>div{flex:1}</style>
</head>
<body>
<div class="stage" data-theme="macos"><div id="root"></div></div>
<script>
const NS = window.KBLLRCoreXDesignSystem_019e2e;
const h = React.createElement;
const { GlassSurface, GlassGroup, GlassButton, IdentityRow, ChatBubble, Field } = NS;
function Shell(){const [m,setM]=React.useState('Conversations');const [s,setS]=React.useState('Avara');const [d,setD]=React.useState('');
 const seg=(t)=>h('button',{key:t,className:'seg',type:'button','aria-pressed':m===t,onClick:()=>setM(t)},t);
 const r=(p)=>h(IdentityRow,{key:p.name,...p,selected:s===p.name,onSelect:()=>setS(p.name)});
 return h('div',{className:'win'},
  h('div',{style:{position:'relative'}},h('div',{className:'back'},h('i',{className:'b1'}),h('i',{className:'b2'})),
   h(GlassSurface,{pad:0,className:'side',style:{position:'relative',height:'calc(100% - 16px)',boxSizing:'border-box'}},
    h('div',{style:{padding:'0 8px'}},h(GlassGroup,{label:'Sidebar mode',style:{display:'flex'}},['Conversations','Missions'].map(seg))),
    h('h4',null,'Head'),r({name:'Eli',head:true,house:'Core-X',status:'active'}),
    h('h4',null,'Houses'),r({name:'Anja',roles:['academic head','Project Anja house orchestrator'],status:'active'}),r({name:'Avara',house:'Avatar Labs',status:'development'}))),
  h('div',{className:'main'},
   h('div',{className:'bar'},h('b',null,s),h('code',null,'agent:'+s.toLowerCase()),h('span',{style:{flex:1}}),
    h(GlassGroup,{label:'Thread actions'},['Handoff','Profile'].map((t)=>h('button',{key:t,className:'seg',type:'button'},t)))),
   h('div',{className:'thread'},
    h(ChatBubble,{from:'user',label:'You',time:'14:02',body:'Summarise the open missions for this house.'}),
    h(ChatBubble,{label:s,agentId:'agent:'+s.toLowerCase(),time:'14:02',body:'Two missions are open. One is waiting on plan approval; the other has a verified run and no pending steps.'})),
   h('div',{className:'compose'},h(Field,{value:d,onChange:setD,placeholder:'Message '+s+'…',mono:false}),h(GlassButton,{variant:'prominent'},'Send'))));}
ReactDOM.createRoot(document.getElementById('root')).render(h(Shell));
</script>
</body>
</html>
