<!-- @dsCard group="Components" height=200 width=700 subtitle="Signal indicator · 5 tones" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status dot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500&family=Inter:wght@200;300;400;500;600;700&display=swap">
<style>
html,body{background:var(--bg);width:700px;min-height:200px;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(0deg,transparent 0 99px,#9a9a9a22 99px 100px),repeating-linear-gradient(90deg,transparent 0 99px,#9a9a9a22 99px 100px)}
#root{position:relative;z-index:1;padding:22px 26px}
.spec{display:flex;flex-direction:column;gap:14px}
.spec-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.spec-lbl{font-family:var(--font-mono);font-size:9px;color:var(--fg3);text-transform:uppercase;letter-spacing:0.1em}
</style>
</head>
<body>
<div id="root"></div>
<script>
const { StatusDot } = window.KBLLRCoreXDesignSystem_019e2e;
const h = React.createElement;

function demo(){
  const tones = ["up","warn","down","info","idle"];
  return h('div',{className:'spec'},
    h('div',{className:'spec-lbl'},'tones'),
    h('div',{className:'spec-row'}, tones.map(t=>h(StatusDot,{key:t,tone:t,label:t}))),
    h('div',{className:'spec-lbl'},'sizes'),
    h('div',{className:'spec-row'}, [5,6,8,10,14].map(s=>h(StatusDot,{key:s,tone:'up',size:s}))),
    h('div',{className:'spec-lbl'},'pulse · attention only'),
    h('div',{className:'spec-row'}, h(StatusDot,{tone:'down',size:9,pulse:true,label:'offline'}))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(demo());
</script>
</body>
</html>
